<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>تسجيل الدخول - منصة قيادة الأداء المدرسي</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #e8f3ea;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 16px;
      box-sizing: border-box;
    }
    .card {
      width: 100%;
      max-width: 480px;
      background: #fff;
      border-radius: 22px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.08);
      padding: 24px;
    }
    .site-title {
      text-align: center;
      color: #14532d;
      line-height: 1.8;
      margin-bottom: 18px;
    }
    .site-title h1 {
      margin: 0;
      font-size: 28px;
    }
    .site-title p {
      margin: 6px 0 0;
      color: #6b7280;
      font-size: 14px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
    }
    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #d1d5db;
      border-radius: 14px;
      font-size: 15px;
      margin-bottom: 14px;
      box-sizing: border-box;
    }
    button {
      border: none;
      border-radius: 14px;
      padding: 12px 18px;
      cursor: pointer;
      font-size: 15px;
    }
    .btn-primary {
      background: #166534;
      color: #fff;
      width: 100%;
    }
    .btn-secondary {
      background: #dbe7dd;
      color: #14532d;
      width: 100%;
      margin-top: 10px;
    }
    .message-box {
      display: none;
      padding: 12px 14px;
      border-radius: 12px;
      margin-bottom: 14px;
      line-height: 1.8;
      font-size: 14px;
      border: 1px solid transparent;
    }
    .message-box.error {
      display: block;
      background: #fee2e2;
      color: #991b1b;
      border-color: #fecaca;
    }
    .message-box.success {
      display: block;
      background: #dcfce7;
      color: #166534;
      border-color: #bbf7d0;
    }
    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 12px;
    }
    .actions a {
      color: #14532d;
      text-decoration: none;
      font-weight: bold;
    }
    .muted {
      color: #6b7280;
      margin-top: 12px;
      line-height: 1.8;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="site-title">
      <h1>منصة قيادة الأداء المدرسي</h1>
      <p>النخيل الابتدائية بالقطيف – طفولة مبكرة والروضة الملحقة بها</p>
    </div>

    <div id="loginMessage" class="message-box"></div>

    <form id="loginForm">
      <label>البريد الإلكتروني</label>
      <input id="loginEmail" type="email" required />

      <label>كلمة المرور</label>
      <input id="loginPassword" type="password" required />

      <button class="btn-primary" type="submit">تسجيل الدخول</button>
    </form>

    <button class="btn-secondary" type="button" onclick="sendResetPassword()">
      نسيت كلمة المرور؟
    </button>

    <div class="actions">
      <a href="signup.html">إنشاء حساب جديد</a>
    </div>

    <div class="muted">
      يلزم تسجيل الدخول بحساب معتمد من إدارة المدرسة للوصول إلى خصائص المنصة.
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const supabaseUrl = "https://uekovggqcsnbwpnbibjz.supabase.co";
    const supabaseKey = "sb_publishable_i0vQ90zclZwHaSFCzHOOfw_Gsfkld9f";
    const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);

    function showMessage(type, message) {
      const box = document.getElementById("loginMessage");
      box.className = `message-box ${type}`;
      box.textContent = message;
      box.style.display = "block";
    }

    const params = new URLSearchParams(window.location.search);
    const returnTo = params.get("return") || "index.html";

    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();

      const email = document.getElementById("loginEmail").value.trim().toLowerCase();
      const password = document.getElementById("loginPassword").value;

      const { error } = await supabaseClient.auth.signInWithPassword({
        email,
        password
      });

      if (error) {
        showMessage("error", "فشل تسجيل الدخول، تأكدي من البريد وكلمة المرور");
        return;
      }

      const { data: userRow, error: userError } = await supabaseClient
        .from("users")
        .select("status")
        .eq("email", email)
        .maybeSingle();

      if (userError || !userRow) {
        await supabaseClient.auth.signOut();
        showMessage("error", "تم تسجيل الدخول، لكن لا يوجد سجل مستخدم مرتبط بهذا البريد");
        return;
      }

      if (userRow.status !== "active") {
        await supabaseClient.auth.signOut();
        showMessage("error", "حسابك بانتظار موافقة المديرة قبل الدخول للمنصة");
        return;
      }

      showMessage("success", "تم تسجيل الدخول بنجاح، جاري التحويل");
      setTimeout(() => {
        window.location.href = returnTo;
      }, 700);
    });

    async function sendResetPassword() {
      const email = document.getElementById("loginEmail").value.trim().toLowerCase();

      if (!email) {
        showMessage("error", "اكتبي البريد الإلكتروني أولًا ثم اضغطي نسيت كلمة المرور");
        return;
      }

      const redirectTo = window.location.origin + "/reset-password.html";

      const { error } = await supabaseClient.auth.resetPasswordForEmail(email, {
        redirectTo
      });

      if (error) {
        showMessage("error", error.message || "تعذر إرسال رابط إعادة تعيين كلمة المرور");
        return;
      }

      showMessage("success", "تم إرسال رابط إعادة تعيين كلمة المرور إلى بريدك الإلكتروني");
    }
  </script>
</body>
</html>
