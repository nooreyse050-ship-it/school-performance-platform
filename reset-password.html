<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>تغيير كلمة المرور</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #e8f3ea;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 16px;
      box-sizing: border-box;
    }
    .card {
      width: 100%;
      max-width: 480px;
      background: #fff;
      border-radius: 22px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.08);
      padding: 24px;
    }
    h1 {
      color: #14532d;
      margin-top: 0;
      text-align: center;
    }
    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
    }
    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #d1d5db;
      border-radius: 14px;
      font-size: 15px;
      margin-bottom: 14px;
      box-sizing: border-box;
    }
    button {
      border: none;
      border-radius: 14px;
      padding: 12px 18px;
      cursor: pointer;
      font-size: 15px;
    }
    .btn-primary {
      background: #166534;
      color: #fff;
      width: 100%;
    }
    .message-box {
      display: none;
      padding: 12px 14px;
      border-radius: 12px;
      margin-bottom: 14px;
      line-height: 1.8;
      font-size: 14px;
      border: 1px solid transparent;
    }
    .message-box.error {
      display: block;
      background: #fee2e2;
      color: #991b1b;
      border-color: #fecaca;
    }
    .message-box.success {
      display: block;
      background: #dcfce7;
      color: #166534;
      border-color: #bbf7d0;
    }
    .muted {
      color: #6b7280;
      margin-top: 12px;
      line-height: 1.8;
      font-size: 14px;
      text-align: center;
    }
    a {
      color: #14532d;
      font-weight: bold;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>تغيير كلمة المرور</h1>

    <div id="resetMessage" class="message-box"></div>

    <form id="resetForm">
      <label>كلمة المرور الجديدة</label>
      <input id="newPassword" type="password" required />

      <label>تأكيد كلمة المرور الجديدة</label>
      <input id="confirmPassword" type="password" required />

      <button class="btn-primary" type="submit">حفظ كلمة المرور الجديدة</button>
    </form>

    <div class="muted">
      بعد الحفظ يمكنك العودة إلى <a href="login.html">تسجيل الدخول</a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const supabaseUrl = "https://uekovggqcsnbwpnbibjz.supabase.co";
    const supabaseKey = "sb_publishable_i0vQ90zclZwHaSFCzHOOfw_Gsfkld9f";
    const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);

    function showMessage(type, message) {
      const box = document.getElementById("resetMessage");
      box.className = `message-box ${type}`;
      box.textContent = message;
      box.style.display = "block";
    }

    document.getElementById("resetForm").addEventListener("submit", async (e) => {
      e.preventDefault();

      const newPassword = document.getElementById("newPassword").value;
      const confirmPassword = document.getElementById("confirmPassword").value;

      if (newPassword.length < 6) {
        showMessage("error", "كلمة المرور يجب أن تكون 6 أحرف على الأقل");
        return;
      }

      if (newPassword !== confirmPassword) {
        showMessage("error", "كلمتا المرور غير متطابقتين");
        return;
      }

      const { error } = await supabaseClient.auth.updateUser({
        password: newPassword
      });

      if (error) {
        showMessage("error", error.message || "تعذر تحديث كلمة المرور");
        return;
      }

      showMessage("success", "تم تغيير كلمة المرور بنجاح");

      setTimeout(async () => {
        await supabaseClient.auth.signOut();
        window.location.href = "login.html";
      }, 1200);
    });
  </script>
</body>
</html>
